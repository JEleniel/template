too-many-lines-threshold = 50
module-item-order-groupings = [
    [ "modules", [ "extern_crate", "mod", "foreign_mod" ], ],
    [ "use", [ "use", ], ],
    [ "everything_else", [ "macro", "global_asm", "const", "static",  "ty_alias", "enum", "struct", "union", "trait", "trait_alias", "impl", "fn", ], ],
]
